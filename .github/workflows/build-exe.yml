name: Build Windows EXE

on:
  workflow_dispatch:        # 允许在 Actions 页面手动点击运行
  push:
    tags:
      - "v*"                # 推送 v1.0.0 这类 tag 时自动构建并发布 Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build frontend
        working-directory: web-ui
        run: |
          npm install
          npm run build

      - name: Copy frontend to dist
        shell: pwsh
        run: |
          Write-Host "== web-ui contents =="
          Get-ChildItem web-ui
          if (Test-Path web-ui/dist) {
            New-Item -ItemType Directory -Force dist | Out-Null
            Copy-Item -Recurse -Force web-ui/dist/* dist/
          } elseif (Test-Path dist) {
            Write-Host "dist already at repo root, skipping copy"
          } else {
            Write-Error "frontend build output not found"
            exit 1
          }
          Get-ChildItem dist

      - name: Install Chromium into Playwright package
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m playwright install chromium

      - name: Build exe with PyInstaller
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: >
          pyinstaller desktop_launcher.py
          --name XianyuMonitor
          --onedir --noconfirm
          --distpath out
          --collect-all playwright
          --collect-submodules src
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          --add-data "dist;dist"
          --add-data "static;static"
          --add-data ".env.example;."

      - name: Zip result
        run: Compress-Archive -Path out\XianyuMonitor -DestinationPath XianyuMonitor-windows.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XianyuMonitor-windows
          path: XianyuMonitor-windows.zip

      - name: Publish Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: XianyuMonitor-windows.zip
